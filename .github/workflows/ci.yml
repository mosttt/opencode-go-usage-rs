name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  binary:
    name: ${{ matrix.name }} binary
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            family: linux
            archive: tar.gz
            artifact: opencode-go-usage-linux-x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            family: linux
            archive: tar.gz
            artifact: opencode-go-usage-linux-aarch64
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            family: windows
            archive: zip
            artifact: opencode-go-usage-windows-x86_64
          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            family: macos
            archive: tar.gz
            artifact: opencode-go-usage-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="${{ matrix.artifact }}"
          mkdir -p "dist/$package/docs"
          install -m 755 "target/${{ matrix.target }}/release/opencode-go-usage" "dist/$package/opencode-go-usage"
          cp config.example.json README.md LICENSE "dist/$package/"
          cp docs/deployment.md "dist/$package/docs/"
          if [[ "${{ matrix.family }}" == "linux" ]]; then
            mkdir -p "dist/$package/deploy"
            cp deploy/opencode-go-usage.service "dist/$package/deploy/"
          fi
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")
          fi
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "${{ matrix.artifact }}"
          $root = Join-Path "dist" $package
          New-Item -ItemType Directory -Force -Path (Join-Path $root "docs") | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/opencode-go-usage.exe" (Join-Path $root "opencode-go-usage.exe")
          Copy-Item config.example.json,README.md,LICENSE $root
          Copy-Item docs/deployment.md (Join-Path $root "docs")
          Compress-Archive -Path $root -DestinationPath "dist/$package.zip"
          Remove-Item $root -Recurse -Force
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-go-usage-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag

  docker:
    name: Docker image
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opencode-go-usage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
